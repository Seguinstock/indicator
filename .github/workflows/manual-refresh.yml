name: Manual market refresh

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

concurrency:
  group: manual-market-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.actor == 'Seguinstock' && github.event.issue.title == 'Refresh Stock Indicator' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full market scan
        run: python engine/defensive_runtime.py
      - name: Publish refreshed results
        run: |
          git config user.name "stock-indicator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/results.json
          if ! git diff --cached --quiet; then
            git commit -m "Manual market refresh"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Close refresh request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --comment "Mise à jour forcée terminée. Les nouvelles données seront publiées automatiquement sur Stock Indicator."
