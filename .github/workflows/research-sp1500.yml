name: Research S&P 1500 strategies

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: stock-indicator-research-sp1500
  cancel-in-progress: false

jobs:
  research:
    if: ${{ github.actor == 'Seguinstock' && github.event.issue.title == 'Run Stock Indicator S&P 1500 Research' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pitindex
      - name: Run S&P 1500 robustness study
        env:
          RESEARCH_SEED: '20260910'
          RESEARCH_PERIODS: '16'
          RESEARCH_WINDOW_DAYS: '50'
        run: python engine/research_sp1500.py
      - name: Publish research result
        run: |
          git config user.name "stock-indicator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/research_sp1500.json
          if ! git diff --cached --quiet; then
            git commit -m "Run S&P 1500 six-strategy research"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Close request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Étude S&P 1500 terminée : 6 stratégies × 16 fenêtres de 50 jours. Résultat : data/research_sp1500.json."
          gh issue close "$ISSUE_NUMBER"
