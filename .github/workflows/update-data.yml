name: Update market data

on:
  workflow_dispatch:
  schedule:
    - cron: '15 22 * * 1-5'
      timezone: 'America/Toronto'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python engine/scanner.py
      - name: Commit refreshed results
        run: |
          git config user.name "stock-indicator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/results.json
          git diff --cached --quiet || git commit -m "Update market scan"
          git push
