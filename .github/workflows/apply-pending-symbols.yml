name: Apply pending symbols batch
on:
  workflow_dispatch:
  push:
    paths:
      - 'config/pending_symbols_batch.json'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply pending symbols
        run: python engine/apply_pending_symbols_batch.py
      - name: Commit symbols
        run: |
          git config user.name "stock-indicator-config-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/symbols.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add pending Canadian symbols"
          git pull --rebase origin main
          git push origin main
