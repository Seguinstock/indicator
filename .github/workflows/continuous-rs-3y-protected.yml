name: Continuous RS 3Y Protected Exit Comparison

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  backtest:
    if: github.event.issue.title == 'Run Continuous RS 3Y Protected Exits'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pitindex lxml
      - name: Run protected-exit variants with shared Yahoo cache
        run: python engine/run_rs3y_variants.py
      - name: Publish results
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/backtest_relative_strength_continuous_3y_*.json
          git commit -m "Publish continuous RS 3Y protected-exit comparison" || true
          git pull --rebase origin main
          git push
      - name: Close request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            gh issue comment "${{ github.event.issue.number }}" --body "Continuous RS 3Y protected-exit comparison completed with shared Yahoo cache and price-audit flags."
          else
            gh issue comment "${{ github.event.issue.number }}" --body "Protected-exit comparison ended with status: ${{ job.status }}. Check the Actions log."
          fi
          gh issue close "${{ github.event.issue.number }}"
