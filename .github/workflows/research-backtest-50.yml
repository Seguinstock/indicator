name: Research 50 backtests

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: stock-indicator-research-50
  cancel-in-progress: false

jobs:
  research:
    if: ${{ github.actor == 'Seguinstock' && github.event.issue.title == 'Run Stock Indicator Research 50' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pitindex
      - name: Run 50-test robustness study
        env:
          RESEARCH_SEED: '20260910'
          RESEARCH_PERIODS: '10'
          RESEARCH_WINDOW_DAYS: '50'
        run: python engine/research_backtest_50.py
      - name: Publish research result
        run: |
          git config user.name "stock-indicator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/research_backtest_50.json
          git commit -m "Run 50-test robustness study" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Close request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --comment "Étude de robustesse terminée : 5 stratégies × 10 fenêtres historiques de 50 jours, S&P 500 point-in-time. Résultat dans data/research_backtest_50.json."
