name: Historical backtest

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

concurrency:
  group: stock-indicator-backtest
  cancel-in-progress: false

jobs:
  backtest:
    if: ${{ github.actor == 'Seguinstock' && github.event.issue.title == 'Run Stock Indicator Backtest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pitindex
      - name: Parse requested dates and universe
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - <<'PY'
          import os,re
          from datetime import date,timedelta
          body=os.environ.get('ISSUE_BODY','')
          m1=re.search(r'BACKTEST_ASOF=(\d{4}-\d{2}-\d{2})',body)
          m2=re.search(r'BACKTEST_END=(\d{4}-\d{2}-\d{2})',body)
          mu=re.search(r'BACKTEST_UNIVERSE=([A-Za-z0-9_\-]+)',body)
          if not m1: raise SystemExit('Date de départ manquante')
          asof=date.fromisoformat(m1.group(1))
          end=date.fromisoformat(m2.group(1)) if m2 else asof+timedelta(days=28)
          universe=(mu.group(1).lower() if mu else 'current')
          if universe not in {'current','sp500_pit','sp1500_pit'}: raise SystemExit('Univers de backtest invalide')
          if universe=='sp500_pit' and asof < date(2005,1,1): raise SystemExit('Le S&P 500 historique point-in-time est disponible à partir de 2005')
          if universe=='sp1500_pit' and asof < date(2021,3,26): raise SystemExit('Le S&P 1500 historique point-in-time est disponible à partir du 26 mars 2021')
          if end <= asof: raise SystemExit('La date de fin doit être après la date historique')
          if (end-asof).days > 400: raise SystemExit('Fenêtre maximale : 400 jours')
          if asof >= date.today(): raise SystemExit('La date historique doit être dans le passé')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write(f'BACKTEST_ASOF={asof.isoformat()}\n')
              f.write(f'BACKTEST_END={end.isoformat()}\n')
              f.write(f'BACKTEST_UNIVERSE={universe}\n')
          PY
      - name: Run historical backtest
        run: python engine/backtest_v2.py
      - name: Publish backtest results
        run: |
          git config user.name "stock-indicator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest.json
          if ! git diff --cached --quiet; then
            git commit -m "Run historical backtest $BACKTEST_ASOF ($BACKTEST_UNIVERSE)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Close request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --comment "Backtest terminé pour $BACKTEST_ASOF au $BACKTEST_END avec l'univers $BACKTEST_UNIVERSE et enregistré dans data/backtest.json."
