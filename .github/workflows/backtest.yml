name: Historical backtest

on:
  issues:
    types:
      - opened

permissions:
  contents: write
  issues: write

concurrency:
  group: stock-indicator-backtest
  cancel-in-progress: false

jobs:
  backtest:
    if: ${{ github.actor == 'Seguinstock' && github.event.issue.title == 'Run Stock Indicator Backtest' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run historical backtest
        run: python engine/backtest.py
      - name: Publish backtest results
        run: |
          git config user.name "stock-indicator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest.json
          if ! git diff --cached --quiet; then
            git commit -m "Run historical backtest"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Close request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --comment "Backtest terminé et enregistré dans data/backtest.json."
