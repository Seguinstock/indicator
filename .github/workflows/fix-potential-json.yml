name: Fix potential JSON serialization
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  fix:
    if: github.actor == 'Seguinstock' && github.event.issue.title == 'Fix Stock Indicator Potential JSON'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scanner serialization
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('engine/scanner.py')
          s=p.read_text(encoding='utf-8')
          old="'filters':checks,'passed':all(checks.values()),'score':round(potential,1)}"
          new="'filters':{k:bool(v) for k,v in checks.items()},'passed':bool(all(checks.values())),'score':round(potential,1)}"
          if old not in s:
              raise SystemExit('Target serialization text not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "stock-indicator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add engine/scanner.py
          git commit -m "Fix potential score JSON serialization"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Close request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed
