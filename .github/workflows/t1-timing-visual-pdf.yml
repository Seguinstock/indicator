name: T1 timing - 100 charts 1 year

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t1-timing-visual-pdf.yml'

permissions:
  contents: read

jobs:
  t1-isolated-timing-report:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install 'yfinance>=0.2.65' 'pandas>=2.2' 'numpy>=2.0' 'matplotlib>=3.9' 'reportlab>=4.0'
      - name: Calculate official buy timing and build T1 visual PDF
        run: python research/t1_timing_visual_report.py
      - name: Save T1 results and PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1-timing-100-visual-report
          path: |
            research/t1_timing_100_results.json
            research/classement_t1_timing_100_courbes_1_an.pdf
          if-no-files-found: warn
          retention-days: 30
