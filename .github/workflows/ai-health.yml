name: Analyze buy candidates with AI

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: stock-indicator-ai-health
  cancel-in-progress: false

jobs:
  analyze:
    if: (github.actor == 'Seguinstock' || github.actor == 'c7rrhj86t8-a11y') && startsWith(github.event.issue.title, 'AI: analyser santé achat')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Analyze displayed buy candidates
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: python engine/ai_health_analysis.py
      - name: Publish AI analysis
        run: |
          git config user.name "stock-indicator-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ai-health.json
          git commit -m "Refresh AI health analysis"
          git pull --rebase origin main
          git push origin main
      - name: Close request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Analyse IA terminée et publiée dans Stock Indicator."
