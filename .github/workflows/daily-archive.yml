name: Daily top-12 archive

on:
  workflow_dispatch:
    inputs:
      mode:
        description: morning or evening
        required: true
        default: morning
  schedule:
    - cron: '0 8 * * 1-5'
      timezone: 'America/Toronto'
    - cron: '0 19 * * 1-5'
      timezone: 'America/Toronto'

permissions:
  contents: write

concurrency:
  group: daily-top12-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Choose archive phase
        id: phase
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(TZ=America/Toronto date +%H)
            if [ "$HOUR" -lt 12 ]; then echo "mode=morning" >> "$GITHUB_OUTPUT"; else echo "mode=evening" >> "$GITHUB_OUTPUT"; fi
          fi
      - run: python engine/daily_archive.py "${{ steps.phase.outputs.mode }}"
      - name: Commit archive
        run: |
          git config user.name "stock-indicator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily_archive.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive daily top-12 (${{ steps.phase.outputs.mode }})"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
