name: Apply site configuration change

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: stock-indicator-config
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == 'Seguinstock' && startsWith(github.event.issue.title, 'Config:')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply requested change
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python engine/apply_config_change.py
      - name: Save configuration immediately
        run: |
          git config user.name "stock-indicator-config-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/
          if git diff --cached --quiet; then
            echo "No configuration change required"
          else
            git commit -m "Apply Stock Indicator configuration change"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Recalculate Stock Indicator
        run: python engine/scanner.py
      - name: Publish refreshed results
        run: |
          git add data/results.json
          if git diff --cached --quiet; then
            echo "No result change required"
          else
            git commit -m "Refresh Stock Indicator after configuration change"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Close request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Paramètres enregistrés et nouveau scan terminé. Les résultats affichés utilisent maintenant les nouveaux paramètres."
