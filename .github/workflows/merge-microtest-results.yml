name: Merge microtest A B1 B2 results

on:
  issues:
    types: [opened]
  push:
    paths:
      - 'engine/merge_trigger.txt'

permissions:
  contents: write
  issues: write

jobs:
  merge:
    if: github.event_name == 'push' || github.event.issue.title == 'Merge Stock Indicator Microtest A B1 B2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install merge dependencies
        run: pip install numpy
      - name: Ensure historical Lot A commit is available
        run: git fetch origin bc7bc0edea4ecf04bb67ee409e297ad1025d227f || true
      - name: Merge period-level results
        run: python engine/merge_microtest_results.py
      - name: Publish merged result
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          cp data/microtest_merged_a_b1_b2.json /tmp/microtest_merged_a_b1_b2.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/microtest_merged_a_b1_b2.json data/microtest_merged_a_b1_b2.json
          git add data/microtest_merged_a_b1_b2.json
          if git diff --cached --quiet; then
            echo "Merged result already matches main"
          else
            git commit -m "Publish merged A B1 B2 microtest results"
            git push origin HEAD:main
          fi
      - name: Close request
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "A+B1+B2 period-level merge completed. Results: data/microtest_merged_a_b1_b2.json"
          gh issue close "${{ github.event.issue.number }}"
