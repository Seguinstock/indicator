name: Risk memory 5y research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install 'yfinance>=0.2.65' 'pandas>=2.2' 'numpy>=2.0'
      - name: Run isolated historical risk experiment
        run: python research/risk_memory_5y.py
      - name: Upload experimental results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-memory-5y-sample
          path: research/risk_memory_5y_sample.json
          if-no-files-found: warn
          retention-days: 30
