name: Validation RS 3Y V2

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write

concurrency:
  group: validation-rs3y-v2
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor == 'Seguinstock' && github.event.issue.title == 'Run Validation RS 3Y V2'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -U 'pitindex[build]' lxml requests
      - name: Run corrected validation
        run: python engine/validation_rs3y_v2.py
      - name: Publish result
        run: |
          git config user.name "stock-indicator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest_validation_rs3y_v2.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish corrected RS 3Y validation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
