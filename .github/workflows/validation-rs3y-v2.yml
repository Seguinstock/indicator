name: Validation RS 3Y V2

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write

concurrency:
  group: validation-rs3y-v2
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor == 'Seguinstock' && github.event.issue.title == 'Run Validation RS 3Y V2'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Install pitindex from its source tree, not the PyPI wheel: update()
          # imports the repository's scripts.build_dataset module, which is not
          # included in the published wheel.
          pip install -U 'git+https://github.com/arielNacamulli/pitindex.git@2df030e5c9be7c83cf4b28c3d8597d74d274757e#egg=pitindex[build]' lxml requests
      - name: Verify PIT refresh path
        run: |
          python - <<'PY'
          import pitindex
          print('pitindex:', pitindex.__file__)
          print('before:', pitindex.info(index='sp1500'))
          pitindex.update()
          info = pitindex.info(index='sp1500')
          print('after:', info)
          if info.get('is_stale'):
              raise SystemExit('pitindex remains stale after refresh')
          PY
      - name: Run corrected validation
        run: python -u engine/validation_rs3y_v2.py
      - name: Publish result
        run: |
          git config user.name "stock-indicator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest_validation_rs3y_v2.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish corrected RS 3Y validation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
