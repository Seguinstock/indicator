name: Explore S&P 1500 strategies and exits

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  explore:
    if: github.event.issue.title == 'Run Stock Indicator Microtest Explorer'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pitindex
      - name: Run exploratory study
        env:
          MICROTEST_SEED: '20260910'
          MICROTEST_PERIODS: '8'
        run: |
          if [ -f data/microtest_strategy24_request.json ]; then
            STRATEGY=$(python -c "import json; print(json.load(open('data/microtest_strategy24_request.json'))['strategy'])")
            MICROTEST_STRATEGY="$STRATEGY" python engine/microtest_strategy24.py
          else
            python engine/microtest_explorer.py
          fi
      - name: Publish result
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/microtest_explorer.json
          git add data/microtest_*_24.json 2>/dev/null || true
          git add -u data/microtest_strategy24_request.json 2>/dev/null || true
          git commit -m "Publish S&P1500 exploratory microtest results" || true
          git pull --rebase origin main
          git push
      - name: Close request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Exploratory S&P 1500 microtests completed. Results published in data/."
          gh issue close "${{ github.event.issue.number }}"
