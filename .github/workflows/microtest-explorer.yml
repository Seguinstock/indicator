name: Explore S&P 1500 strategies and exits

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  explore:
    if: github.event.issue.title == 'Run Stock Indicator Microtest Explorer'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pitindex
      - name: Run exploratory study
        env:
          MICROTEST_SEED: '20260910'
          MICROTEST_PERIODS: '8'
        run: python engine/microtest_explorer.py
      - name: Publish result
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/microtest_explorer.json
          git commit -m "Publish S&P1500 exploratory microtest results" || true
          git push
      - name: Close request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Exploratory S&P 1500 microtests completed. Results: data/microtest_explorer.json"
          gh issue close "${{ github.event.issue.number }}"
