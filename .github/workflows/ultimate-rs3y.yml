name: Ultimate RS 3Y Backtest

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: ultimate-rs3y-backtest
  cancel-in-progress: false

jobs:
  backtest:
    if: github.actor == 'Seguinstock' && github.event.issue.title == 'Run Ultimate RS 3Y Backtest'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pitindex lxml requests
      - name: Run ultimate backtest
        run: python engine/ultimate_rs3y.py
      - name: Publish result
        run: |
          git config user.name "stock-indicator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest_ultimate_rs3y.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish ultimate RS 3Y backtest"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Close request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = "success" ]; then
            gh issue close "$ISSUE_NUMBER" --comment "Ultimate RS 3Y backtest completed. Result: data/backtest_ultimate_rs3y.json"
          else
            gh issue close "$ISSUE_NUMBER" --comment "Ultimate RS 3Y backtest failed. Check the Actions log."
          fi
