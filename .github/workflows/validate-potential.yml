name: Validate potential theory

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: stock-indicator-potential-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor == 'Seguinstock' && github.event.issue.title == 'Run Stock Indicator Potential Validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run five one-year validation windows
        run: python engine/validate_potential.py
      - name: Commit validation results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/backtest_validation.json
          git commit -m 'Update potential validation results' || exit 0
          git pull --rebase
          git push
      - name: Close request
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --comment 'Validation terminée. Résultats enregistrés dans data/backtest_validation.json.'
