name: R3 historical risk research 100 stocks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/risk-memory-r3-100.yml'

permissions:
  contents: read

jobs:
  isolated-r3-research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated research dependencies
        run: pip install 'yfinance>=0.2.65' 'pandas>=2.2' 'numpy>=2.0'
      - name: Run R3 on the same 100 titles and compare R2
        run: python research/risk_memory_r3_100.py
      - name: Archive R3 experimental results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-memory-r3-100-results
          path: research/risk_memory_r3_100_results.json
          if-no-files-found: warn
          retention-days: 30
