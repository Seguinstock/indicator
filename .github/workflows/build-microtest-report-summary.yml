name: Build microtest report summary

on:
  push:
    paths:
      - 'data/microtest_report_trigger.txt'

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build compact analysis summary
        run: python engine/build_microtest_report_summary.py
      - name: Publish compact analysis summary
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          cp data/microtest_report_summary.json /tmp/microtest_report_summary.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/microtest_report_summary.json data/microtest_report_summary.json
          git add data/microtest_report_summary.json
          if git diff --cached --quiet; then
            echo "Report summary already matches main"
          else
            git commit -m "Publish microtest report summary"
            git push origin HEAD:main
          fi
